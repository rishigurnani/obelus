name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Create environment
        run: uv venv --python 3.14 .venv
      - name: Install
        run: uv pip install --python .venv -e ".[dev]"
      - name: Test suite
        run: .venv/bin/python -m pytest -q
      - name: Mutation test the statistical engine
        # obelus.core.mutator handles runtime *model* mutation; mutmut verifies
        # obelus's own logic — the stats engine is the highest-stakes module.
        # mutmut 3.x is configured in pyproject.toml ([tool.mutmut]); the old
        # --paths-to-mutate/--tests-dir flags no longer exist.
        run: .venv/bin/mutmut run
      - name: Mutation results
        if: always()
        run: .venv/bin/mutmut results

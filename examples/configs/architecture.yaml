# The architecture, and therefore the entire ablation matrix.
#
# obelus.core.discovery scans this config and auto-generates one knockout per
# architectural decision — no variant list is written by hand:
#
#   no_descriptor_branch  _target_ -> torch.nn.Identity   (drop 2D computed features)
#   no_graph_encoder      _target_ -> torch.nn.Identity   (drop learned graph features)
#   no_sequence_encoder   _target_ -> torch.nn.Identity   (drop learned SMILES features)
#   no_fusion             _target_ -> torch.nn.Identity   (learned gating -> plain mean)
#   no_residual           active   -> false               (sever GNN skip connections)
#
# `norm`/`head` style library layers (torch.nn.*) are deliberately NOT ablated:
# discovery only knocks out modules whose _target_ matches the project prefix.

model:
  _target_: examples.molnet_ablation.layers.HybridMolecularClassifier
  hidden: 64

  # Hand-crafted 2D descriptors.
  descriptor_branch:
    _target_: examples.molnet_ablation.layers.DescriptorBranch
    in_dim: 16
    hidden: 64
    dropout: 0.2

  # Learned representation #1: message passing over the atom graph.
  graph_encoder:
    _target_: examples.molnet_ablation.layers.GraphEncoder
    hidden: 64
    layers: 2
    residual:
      active: true

  # Learned representation #2: Transformer over SMILES characters.
  sequence_encoder:
    _target_: examples.molnet_ablation.layers.SequenceEncoder
    hidden: 64
    d_model: 48
    layers: 1
    nhead: 4
    dim_feedforward: 96
    dropout: 0.1

  # How the branch embeddings are combined.
  fusion:
    _target_: examples.molnet_ablation.layers.GatedFusion
    hidden: 64

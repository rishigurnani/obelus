[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obelus"
version = "0.1.0"
description = "Offline-first neural-network verification, benchmark-sensitivity, and non-inferiority gating."
authors = [{ name = "obelus-core-team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "omegaconf>=2.3",
    "hydra-core>=1.3",
    "jaxtyping>=0.2",
    "beartype>=0.17",
    "icontract>=2.6",
    "hypothesis>=6.0",
    "torchtest>=0.5",
]

[project.optional-dependencies]
# mlflow pulls flask/fastapi/uvicorn; it is an edge adapter behind the Tracker
# interface, so it is optional. Core logic never imports it.
mlflow = ["mlflow>=2.9"]
# Chemistry stack used only by examples/ (RDKit descriptors/graphs, sklearn metrics).
examples = ["rdkit>=2023.9", "scikit-learn>=1.3"]
dev = ["pytest>=8.0", "mlflow>=2.9", "mutmut>=2.4"]

[tool.setuptools.packages.find]
include = ["obelus*"]

[tool.mutmut]
# mutmut 3.x takes its configuration here rather than from CLI flags (the
# --paths-to-mutate / --tests-dir options were removed).
# obelus.core.mutator mutates *models* at runtime; mutmut mutates obelus's own
# logic, and the stats engine is the highest-stakes module to keep honest.
# source_paths is the tree copied into the mutants/ sandbox, so it must be the
# whole importable package; only_mutate narrows what actually gets mutated.
source_paths = ["obelus"]
only_mutate = ["obelus/core/stats.py"]
pytest_add_cli_args_test_selection = ["tests/test_stats.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
# examples/ is intentionally not part of the installed package, so put the repo
# root on sys.path for the example smoke tests. Without this, invocations that
# run the pytest script directly (e.g. `uv run pytest`) cannot import it.
pythonpath = ["."]
